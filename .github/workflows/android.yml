# ============================================================
# Android 构建（GitHub Actions）
# ------------------------------------------------------------
# 产物：
#   chat-<version>-release.apk  （可直接安装，内测用）
#   chat-<version>-release.aab  （上架 Google Play 用）
#   chat-<version>-debug.apk    （带调试日志，排查问题用）
#
# 签名：
#   配置了 ANDROID_KEYSTORE_BASE64 等 Secrets → 产出已签名包
#   未配置 → 产出 unsigned 包（需自行签名后才能安装）
#
# 说明：本 workflow 完全在 GitHub 的机器上构建，
#      本地服务器（2C1.8G）不参与任何编译。
# ============================================================

name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options: [release, debug, both]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # 签名相关 Secrets 提到 job 级 env，
    # 这样后续 step 的 if 条件才能读到（step 级 env 在 if 求值时还不可用）
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ---------- 1. 构建 Lynx bundle ----------
      - name: 构建 Lynx 客户端包
        run: pnpm --filter @chat/app build

      # ---------- 2. 拷贝 bundle 到 Android assets ----------
      - name: 拷贝 Lynx bundle 到 assets
        run: |
          set -euo pipefail
          ASSETS_DIR="apps/app/android/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"

          # 构建产物文件名带 contenthash，需要找到实际的 bundle 文件
          BUNDLE=$(find apps/app/dist -name "*.lynx.bundle" -type f | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::未找到 Lynx bundle，构建失败"
            find apps/app/dist -type f | head -20
            exit 1
          fi

          echo "找到 bundle: $BUNDLE"
          cp "$BUNDLE" "$ASSETS_DIR/chat.lynx.bundle"
          ls -lh "$ASSETS_DIR/"

      # ---------- 3. 配置 JDK ----------
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          # 让 action 把 gradle 命令装到 PATH，后面生成 wrapper 直接用
          gradle-version: 8.7
          cache-read-only: false

      # ---------- 4. 解码签名证书（可选） ----------
      - name: 解码 keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chat.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/chat.keystore" >> "$GITHUB_ENV"
          echo "keystore 已准备"

      # ---------- 5. 生成 Gradle Wrapper ----------
      # 仓库里不放 gradle-wrapper.jar（二进制），CI 用 setup-gradle 提供的 gradle 生成
      - name: 生成 Gradle Wrapper
        working-directory: apps/app/android
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.7 --no-daemon
          chmod +x gradlew
          echo "=== wrapper 已生成 ==="
          ls -la gradle/wrapper/
          cat gradle/wrapper/gradle-wrapper.properties

      # ---------- 6. 构建 APK ----------
      - name: 构建 Release APK
        if: inputs.build_type != 'debug'
        working-directory: apps/app/android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 构建 Release AAB
        if: inputs.build_type != 'debug'
        working-directory: apps/app/android
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: 构建 Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        working-directory: apps/app/android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ---------- 7. 整理产物 ----------
      - name: 整理产物
        run: |
          set -euo pipefail
          mkdir -p output
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' apps/app/android/app/build.gradle.kts | head -1)
          VERSION=${VERSION:-2.0.0}

          find apps/app/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) | while read -r f; do
            BASENAME=$(basename "$f")
            # 重命名：chat-2.0.0-release.apk
            case "$BASENAME" in
              *release*.apk)  cp "$f" "output/chat-${VERSION}-release.apk" ;;
              *debug*.apk)    cp "$f" "output/chat-${VERSION}-debug.apk" ;;
              *release*.aab)  cp "$f" "output/chat-${VERSION}-release.aab" ;;
              *)              cp "$f" "output/$BASENAME" ;;
            esac
          done

          echo "=== 产物清单 ==="
          ls -lh output/ || echo "没有产物"

      # ---------- 8. 上传产物 ----------
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      # ---------- 9. 构建失败时输出日志 ----------
      - name: 输出构建日志（失败时）
        if: failure()
        run: |
          find apps/app/android -name "*.log" -o -name "lint-results*" | head -10 | while read -r f; do
            echo "=== $f ==="
            tail -50 "$f"
          done
