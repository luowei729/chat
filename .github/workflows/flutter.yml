# ============================================================
# Flutter 客户端构建（GitHub Actions）
# ------------------------------------------------------------
# 为什么放在 Actions：
#   1. 服务器只有 2C/1.8G，本地编译会把服务打挂；
#   2. iOS / macOS / Windows 只能在对应宿主上构建，
#      本机是 Linux，物理上做不到。
#
# 目标平台：
#   Android（APK）、iOS（未签名 app）、macOS、Windows
#
# 鸿蒙（HarmonyOS / OpenHarmony）：
#   需要 OpenHarmony SDK + DevEco 工具链，GitHub 托管机没有授权，
#   因此在 CI 里只做静态检查；打包步骤见 apps/client/README.md。
# ============================================================
name: Flutter Client

on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  # ---------------- Android ----------------
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      # 还原签名密钥
      # ------------------------------------------------------------
      # 为什么必须有这一步：
      #   默认 release 走 debug 签名，而 GitHub Actions 每次都是
      #   全新 runner，~/.android/debug.keystore 由工具链随机生成
      #   —— 于是每次 CI 产出的 APK 签名都不一样，
      #   用户装过一版后再装新版会报「签名不一致」，只能卸载重装。
      #
      # 密钥与密码放在 Secrets 里（不进仓库）：
      #   ANDROID_KEYSTORE_BASE64  = base64 < chat-release.jks
      #   ANDROID_KEY_PROPERTIES   = key.properties 的完整内容
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，将回退 debug 签名（用户无法覆盖安装）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/chat-release.jks
          printf '%s\n' "$KEY_PROPERTIES" > android/key.properties
          echo "签名密钥已还原"

      # 必须用 --split-per-abi
      # ------------------------------------------------------------
      # media_kit / flutter_webrtc 的 AAR 里预置了三套 .so。
      # 不加这个参数会打成「万能包」，单包约 97MB；
      # 拆分后 arm64 约 45MB、v7a 约 36MB，下载和安装都更快。
      - name: 构建 APK（release，分 ABI）
        run: flutter build apk --release --split-per-abi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: chat-android
          path: apps/client/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ---------------- iOS ----------------
  ios:
    name: iOS (未签名)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      # 没有 Apple 开发者证书，只能构建未签名产物用于验证可编译性；
      # 上架需要配置签名证书与 provisioning profile。
      - name: 构建 iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包为 zip
        run: |
          cd build/ios/iphoneos
          zip -qry "$GITHUB_WORKSPACE/chat-ios-unsigned.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: chat-ios
          path: chat-ios-unsigned.zip
          retention-days: 30

  # ---------------- macOS ----------------
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      - name: 打包
        run: |
          cd build/macos/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/chat-macos.zip" chat.app

      - uses: actions/upload-artifact@v4
        with:
          name: chat-macos
          path: chat-macos.zip
          retention-days: 30

  # ---------------- Windows ----------------
  windows:
    name: Windows
    # 固定到 windows-2022：windows-latest 已迁移，上面残留的 VS2019 元数据会让
    # Flutter 误判生成器为 "Visual Studio 16 2019"（只有 VS2022 时直接失败）。
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 诊断：Flutter 靠 vswhere 判断 VS 版本并据此选 CMake 生成器，
      # 判断错就直接 "could not find any instance of Visual Studio"。
      # 把真实信息打进日志，出问题不用猜。
      - name: 诊断 Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json
          } else {
            Write-Host "vswhere not found"
          }
          flutter doctor -v

      - run: flutter pub get
      - run: flutter build windows --release

      # ---------------- 生成 exe 安装包 ----------------
      # windows-latest 镜像**预装** Inno Setup 6，不需要额外下载。
      # 产物 chat-<version>-setup.exe：双击即装、带开始菜单与卸载项。
      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $full = $line.Matches[0].Groups[1].Value.Trim()   # 形如 3.0.1+301
          $name = ($full -split '\+')[0]
          $code = ($full -split '\+')[1]
          "name=$name"          >> $env:GITHUB_OUTPUT
          "code=$code"          >> $env:GITHUB_OUTPUT
          Write-Host "version=$name build=$code"

      - name: 构建安装包（Inno Setup）
        shell: pwsh
        run: |
          # Inno Setup 在各镜像上的安装位置不一致（有的在
          # Program Files (x86)\Inno Setup 6，有的在 Program Files），
          # 也可能加了 PATH。逐个探测，全都找不到才报错。
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 5\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            Write-Error "在所有常见位置都找不到 ISCC.exe，镜像可能变了"
            Write-Host "Program Files 下的候选目录："
            Get-ChildItem "${env:ProgramFiles(x86)}" -Filter "Inno*" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }
          Write-Host "使用：$iscc"
          & $iscc "/DAppVersion=${{ steps.version.outputs.name }}" "windows\installer\chat.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build\windows\installer\*.exe | Format-Table Name, Length

      - name: 打包（便携版 zip）
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:GITHUB_WORKSPACE\chat-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chat-windows
          # 同时上传：便携版 zip + exe 安装包
          path: |
            chat-windows.zip
            apps/client/build/windows/installer/*.exe
          retention-days: 30
